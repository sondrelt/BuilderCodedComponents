<!--
  Default content fragment, shared by every template that doesn't need
  something unique. Paste into the Sending Flow as a fallback constant:
  when an EmailTemplate row's HTML body field is left EMPTY, the Sending
  Flow substitutes this fragment before wrapping it in layout.html at
  {{content}}. A template only gets its own body.html when its content is
  structurally different from paragraph+button (e.g. a repeated-row digest)
  — see "Adding a new template" in CLAUDE.md.

  Placeholders use {{variableName}} — Appfarm does no interpolation itself,
  substitution happens in the sending Flow. Keep variable names in sync
  with each template's template.json "variables" list.
-->
<p style="margin:0 0 12px;font-size:20px;font-weight:700;color:#111827;">Hei {{recipientName}},</p>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0 0 24px;">
  <tr>
    <td style="height:1px;line-height:1px;font-size:1px;background-color:#e5e7eb;">&nbsp;</td>
  </tr>
</table>
<p style="margin:0 0 32px;font-size:16px;line-height:1.6;color:#374151;">{{mainSection}}</p>
<table role="presentation" cellpadding="0" cellspacing="0" align="center" style="margin:0 auto;">
  <tr>
    <td style="border-radius:8px;background-color:#f59a17;">
      <a href="{{buttonUrl}}" style="display:inline-block;padding:14px 32px;color:#ffffff;font-size:16px;font-weight:700;text-decoration:none;border-radius:8px;">{{buttonText}}</a>
    </td>
  </tr>
</table>
